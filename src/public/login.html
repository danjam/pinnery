<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in — Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <script>try{var d=document.documentElement,t=localStorage.getItem('pinnery.theme'),a=localStorage.getItem('pinnery.accent'),c={green:'#2d8545',blue:'#1971c2',orange:'#c2410c'}[a];if(t==='light'||t==='dark')d.dataset.theme=t;if(c){d.dataset.accent=a;document.querySelector('link[rel=icon]').href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="'+c+'"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>')}}catch(e){}</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <form class="login" id="login" autocomplete="on">
    <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</h1>
    <label for="email" class="visually-hidden">Email</label>
    <input id="email" name="email" type="email" placeholder="Email" required autofocus autocomplete="username" spellcheck="false">
    <label for="password" class="visually-hidden">Password</label>
    <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn primary" type="submit">Sign in</button>
    <p class="muted links"><a href="/forgot">Forgot password?</a></p>
    <p class="error" id="error" hidden></p>
  </form>
  <script type="module">
    const form = document.getElementById('login');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: form.email.value, password: form.password.value }),
      });
      if (res.ok) {
        // ?next= continues to a same-origin page (the extension's /connect); anything else goes home.
        const next = new URLSearchParams(location.search).get('next');
        location.replace(next && /^\/(?![/\\])/.test(next) ? next : '/');
        return;
      }
      const body = await res.json().catch(() => ({}));
      error.textContent = body.error || `Sign in failed (${res.status})`;
      error.hidden = false;
      form.password.select();
    });
  </script>
</body>
</html>

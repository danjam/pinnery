<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <!-- Apply the remembered mode and accent before the stylesheet loads so there's no flash (see js/theme.js). -->
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a class="brand" href="/" data-link><svg class="logo" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg><span class="brand-name">Pinnery</span></a>
      <span id="title" style="display: contents"></span>
    </nav>
    <div class="topbar-actions">
      <span id="actions" style="display: contents"></span>
    </div>
  </header>

  <main id="view"></main>

  <div class="selectbar" id="selectbar" hidden>
    <span id="selectcount"></span>
    <button class="btn" id="sel-move">Move</button>
    <button class="btn danger" id="sel-delete">Delete</button>
    <button class="btn ghost" id="sel-cancel">Cancel</button>
  </div>

  <div class="dropcover" id="dropcover" hidden><div>Drop images to pin them</div></div>
  <div class="toasts" id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Choose a new password — Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <form class="login" id="change" autocomplete="on">
    <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</h1>
    <h2>Choose a new password</h2>
    <p class="muted">Pick one only you know before carrying on.</p>
    <label for="current" class="visually-hidden">Current password</label>
    <input id="current" name="current" type="password" placeholder="Current password" required autofocus autocomplete="current-password">
    <label for="next" class="visually-hidden">New password</label>
    <input id="next" name="next" type="password" placeholder="New password (at least 8 characters)" required minlength="8" autocomplete="new-password">
    <label for="again" class="visually-hidden">New password again</label>
    <input id="again" name="again" type="password" placeholder="New password again" required minlength="8" autocomplete="new-password">
    <button class="btn primary" type="submit">Save password</button>
    <p class="error" id="error" hidden></p>
  </form>
  <script type="module" src="/js/password.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Create your account — Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <div class="login" id="card">
    <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</h1>
    <h2>Create your account</h2>
    <p class="muted">You’ve been invited to Pinnery. Choose a name and a password.</p>
    <form id="form" autocomplete="on" hidden>
      <label for="email" class="visually-hidden">Email</label>
      <input id="email" name="email" type="email" readonly autocomplete="username" title="The email this invite was sent to">
      <label for="name" class="visually-hidden">Display name</label>
      <input id="name" name="name" placeholder="Display name" required maxlength="100" autofocus autocomplete="nickname">
      <label for="password" class="visually-hidden">Password</label>
      <input id="password" name="password" type="password" placeholder="Password (at least 8 characters)" required minlength="8" autocomplete="new-password">
      <label for="again" class="visually-hidden">Password again</label>
      <input id="again" name="again" type="password" placeholder="Password again" required minlength="8" autocomplete="new-password">
      <button class="btn primary" type="submit">Create account</button>
    </form>
    <p class="error" id="error" hidden></p>
  </div>
  <script type="module" src="/js/signup.js"></script>
</body>
</html>

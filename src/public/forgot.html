<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Forgot password — Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <script>try{var d=document.documentElement,t=localStorage.getItem('pinnery.theme'),a=localStorage.getItem('pinnery.accent'),c={green:'#2d8545',blue:'#1971c2',orange:'#c2410c'}[a];if(t==='light'||t==='dark')d.dataset.theme=t;if(c){d.dataset.accent=a;document.querySelector('link[rel=icon]').href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="'+c+'"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>')}}catch(e){}</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <div class="login" id="card">
    <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</h1>
    <h2>Forgot your password?</h2>
    <form id="form" autocomplete="on" hidden>
      <p class="muted">Enter your email and we’ll send a link to choose a new one.</p>
      <label for="email" class="visually-hidden">Email</label>
      <input id="email" name="email" type="email" placeholder="Email" required autofocus autocomplete="username" spellcheck="false">
      <button class="btn primary" type="submit">Send reset link</button>
    </form>
    <p class="error" id="error" hidden></p>
  </div>
  <script type="module">
    const card = document.getElementById('card');
    const error = document.getElementById('error');
    const fail = (msg) => { error.textContent = msg; error.hidden = false; };
    const token = location.pathname.split('/').pop();
    // Show a message in place of the form (an unusable link, or a finished step), keeping the brand.
    const replace = (...nodes) => { card.replaceChildren(card.firstElementChild, ...nodes, error); };
    const p = (text, cls = 'muted') => Object.assign(document.createElement('p'), { textContent: text, className: cls });
    const link = (href, text) => { const a = document.createElement('a'); a.className = 'btn primary'; a.href = href; a.textContent = text; return a; };
    const api = async (method, path, body) => {
      const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Something went wrong (${res.status})`);
      return data;
    };
    const form = document.getElementById('form');
    const { enabled } = await api('GET', '/api/mail').catch(() => ({ enabled: true }));
    if (!enabled) {
      replace(p('Email isn’t set up on this Pinnery, so it can’t send reset links. Ask an admin to reset your password for you.'), link('/login', 'Back to sign in'));
    } else {
      form.hidden = false;
      form.email.focus();
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      form.querySelector('button').disabled = true;
      try {
        await api('POST', '/api/forgot', { email: form.email.value });
        replace(p('If that account exists, we’ve emailed a link to choose a new password. It works once and expires in an hour.'), link('/login', 'Back to sign in'));
      } catch (err) {
        fail(err.message);
        form.querySelector('button').disabled = false;
      }
    });
  </script>
</body>
</html>

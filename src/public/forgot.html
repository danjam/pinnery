<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Forgot password — Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d6336c">
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <div class="login" id="card">
    <h1 class="brand"><svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</h1>
    <h2>Forgot your password?</h2>
    <form id="form" autocomplete="on" hidden>
      <p class="muted">Enter your email and we’ll send a link to choose a new one.</p>
      <label for="email" class="visually-hidden">Email</label>
      <input id="email" name="email" type="email" placeholder="Email" required autofocus autocomplete="username" spellcheck="false">
      <button class="btn primary" type="submit">Send reset link</button>
    </form>
    <p class="error" id="error" hidden></p>
  </div>
  <script type="module" src="/js/forgot.js"></script>
</body>
</html>

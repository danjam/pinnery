<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Connect to Pinnery</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Same remembered theme as the app (shared origin), applied before the stylesheet loads. -->
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/connect.css">
</head>
<body class="connect">
  <main class="card">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M15 18h2v9l-1 2-1-2z" fill="#fff"/></svg>Pinnery</div>

    <!-- The approval: "Connect <name> to Pinnery?" -->
    <div id="ask">
      <h1>Connect <b id="name"></b> to Pinnery?</h1>
      <p class="muted">The extension in that browser will be able to pin images and manage boards as you. You can revoke its access at any time from Settings → API tokens.</p>
      <div class="row">
        <button class="btn" id="cancel">Cancel</button>
        <button class="btn primary" id="allow" autofocus>Allow</button>
      </div>
      <p class="error" id="error" hidden></p>
    </div>

    <!-- After a decision: Chrome normally closes the window before this is seen. -->
    <div id="done" class="hidden">
      <p id="done-text"></p>
    </div>
  </main>
  <script type="module" src="/js/connect.js"></script>
</body>
</html>

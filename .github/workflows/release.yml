name: Release

# On every push to master, release-please keeps a "Release PR" up to date: the next version (from
# conventional commits: feat → minor, fix → patch) and CHANGELOG.md. Merging that PR creates the
# tag and GitHub Release, and the image job below builds and pushes it in the same run (a tag made
# with GITHUB_TOKEN wouldn't trigger a separate tag workflow).
#
# Only the app is released. The extension ships inside the image; it learns about newer builds by
# fingerprint (see EXTENSION_FINGERPRINT in src/server.js), not by version number.

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # Settings come from release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@v5
        id: release

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # signing the provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Emulates arm64 so one runner can build both platforms. better-sqlite3 and sharp ship prebuilt
      # linux-arm64 binaries, so nothing is compiled under emulation.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true           # a list of every package in the image, stored next to it in the registry

      # A signed record that this image was built from this commit by this workflow. Check it with
      # `gh attestation verify oci://ghcr.io/danjam/pinnery:<version> --owner danjam`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Scans the published image for known vulnerabilities. Report only: the Debian base always carries
  # some unfixed CVEs, and the image is already out. Its own job with no token permissions, and the
  # action is pinned by commit (its version tags were hijacked in March 2026, GHSA-69fq-xp46-6x23).
  scan:
    needs: image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

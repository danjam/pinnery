name: Test
# Type-checks everything (npm run typecheck), then runs the API test suite (test/**/*.test.ts) against
# a real server and a temporary database, on every push to master and every PR, so a red run shows
# before a release.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile's build and runtime stages must run the same Node major. Renovate bumps the
      # build image but can't rename the runtime one (nodejsNN), so a split bump fails here.
      - name: Node majors match
        run: |
          build=$(sed -nE 's/^FROM node:([0-9]+)-slim.*/\1/p' Dockerfile)
          runtime=$(sed -nE 's|^FROM gcr.io/distroless/nodejs([0-9]+)-.*|\1|p' Dockerfile)
          echo "build node:$build, runtime nodejs$runtime"
          [ -n "$build" ] && [ "$build" = "$runtime" ]
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

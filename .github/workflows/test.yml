name: Test
# Type-checks everything (npm run typecheck), then runs the API test suite (test/**/*.test.ts) against
# a real server and a temporary database, with coverage, on every push to master and every PR, so a
# red run shows before a release. PRs that only change docs skip the suite (see `changes`).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Is this a PR that only touches docs? `test` is a required check, so the workflow can't use
  # paths-ignore (a check that never reports blocks the PR forever); a job skipped by `if:` passes.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs-only: ${{ steps.files.outputs.docs-only }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > files.txt # a rename's old path counts too
          docs=false
          if [ -s files.txt ] && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' files.txt; then docs=true; fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs"; cat files.txt

  test:
    needs: changes
    # Runs on pushes (changes is skipped), and on PRs unless changes said docs-only. If changes
    # itself fails, its output is empty and the tests still run.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Dockerfile's build and runtime stages, and CI below, must run the same Node major.
      # Renovate bumps the build image but can't rename the runtime one (nodejsNN), so a split bump
      # fails here.
      - name: Node majors match
        run: |
          build=$(sed -nE 's/^FROM node:([0-9]+)-slim.*/\1/p' Dockerfile)
          runtime=$(sed -nE 's|^FROM gcr.io/distroless/nodejs([0-9]+)-.*|\1|p' Dockerfile)
          ci=$(sed -nE 's/^ +node-version: *([0-9]+).*/\1/p' .github/workflows/test.yml)
          echo "build node:$build, runtime nodejs$runtime, CI node $ci"
          [ -n "$build" ] && [ "$build" = "$runtime" ] && [ "$build" = "$ci" ]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The tests under c8, which collects coverage from the servers they spawn too
      # (NODE_V8_COVERAGE is inherited). The table goes to the log and the job summary.
      - run: npm run coverage
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Coverage (src/)'; echo '```'; npx c8 report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Coveralls keeps the history, comments the change on PRs and serves the README badge. Its
      # failures don't fail the job: this job is a required check, and an outage there shouldn't block
      # merges.
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false

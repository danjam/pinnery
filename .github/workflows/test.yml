name: Test
# Type-checks everything (npm run typecheck), then runs the API test suite (test/*.test.js) against
# a real server and a temporary database, on every push to master and every PR, so a red run shows
# before a release.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
